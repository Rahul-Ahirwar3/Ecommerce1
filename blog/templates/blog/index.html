
{% extends 'shop/basic.html' %}

{% block title %}Blog Home{% endblock %}

{% block body %}

<style>
    .blog-thumbnail {
        width: 100%;
        height: 220px;
        object-fit: cover;
    }

    .card {
        height: 100%;
    }
</style>

<div class="container my-4">

    <h2>My Awesome Blog</h2>

    <div class="row">

        {% for post in myposts %}

        <div class="col-md-4 my-3">

            <div class="card">

                <img src="{{ post.thumbnail.url }}"
                     class="card-img-top blog-thumbnail"
                     alt="{{ post.title }}">

                <div class="card-body">

                    <h5 class="card-title">
                        {{ post.title }}
                    </h5>

                    <p class="card-text">
                        {{ post.head0|truncatechars:150 }}
                    </p>

                    <a href="{% url 'blogpost' post.post_id %}"
                       class="btn btn-primary">
                        Read More
                    </a>

                </div>

            </div>

        </div>

        {% empty %}

        <div class="col-12">
            <p>No blog posts available.</p>
        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
